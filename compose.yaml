name: frontier

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: frontier
      POSTGRES_USER: frontier
      POSTGRES_PASSWORD: frontier
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontier -d frontier"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - frontier-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: ./apps/backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://frontier:frontier@db:5432/frontier
      PROVIDER_MODE: mock
    ports:
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  frontier-postgres:
